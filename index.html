<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Air Violin - Height Control (G Major)</title>
    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            display: none;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scaleX(-1);
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            pointer-events: none;
            border-left: 4px solid #d4a017;
            width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            color: #d4a017;
        }

        p {
            margin: 5px 0;
            font-size: 0.95rem;
            color: #ccc;
        }

        .instruction-group {
            margin-bottom: 15px;
        }

        .highlight {
            color: #fff;
            font-weight: bold;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            z-index: 20;
            text-align: center;
        }

        button {
            background: #d4a017;
            color: #1e1e1e;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 160, 23, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #e5b02a;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: bold;
        }

        .status-active {
            background: #28a745;
            color: white;
        }

        .status-inactive {
            background: #dc3545;
            color: white;
        }

        #string-indicator {
            font-size: 2rem;
            font-weight: bold;
            color: #d4a017;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            display: block;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="container">
        <div id="loading">Loading Violin Model...</div>
        <canvas id="output_canvas"></canvas>
        <video id="input_video"></video>

        <div id="ui-layer">
            <h1>Invisible Violin</h1>

            <div class="instruction-group">
                <p class="highlight">Left Hand (Bow):</p>
                <p>• <strong>High Arm</strong> = E String</p>
                <p>• <strong>Low Arm</strong> = G String</p>
                <p>• Move <span style="color: #4da6ff">Side-to-Side</span> to Play</p>
            </div>

            <div class="instruction-group">
                <p class="highlight">Right Hand (Fretboard):</p>
                <p>• Bend fingers to add notes</p>
            </div>

            <div id="status-display">
                <span class="status-badge status-inactive" id="audio-status">Audio Off</span>
                <span class="status-badge status-inactive" id="track-status">No Hands</span>
            </div>

            <div id="string-indicator">String: --</div>

            <p style="font-size: 0.8em; color: #888; margin-top: 15px;">Active Notes: <span id="note-display">--</span>
            </p>
        </div>

        <div id="controls">
            <button id="start-btn">Start Violin</button>
        </div>
    </div>

    <script>
        // --- 1. Audio Engine (Synthesizer) ---
        class ViolinSynth {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.filterNode = null;
                this.lfo = null;
                this.lfoGain = null;
                this.isInit = false;

                this.currentString = 'E'; // Default

                // G Major Scale (Standard First Position)
                this.stringMap = {
                    'G': {
                        base: 196.00,
                        notes: [220.00, 246.94, 261.63, 293.66],
                        labels: ['A3', 'B3', 'C4', 'D4']
                    },
                    'D': {
                        base: 293.66,
                        notes: [329.63, 369.99, 392.00, 440.00],
                        labels: ['E4', 'F#4', 'G4', 'A4']
                    },
                    'A': {
                        base: 440.00,
                        notes: [493.88, 554.37, 587.33, 659.25],
                        labels: ['B4', 'C#5', 'D5', 'E5']
                    },
                    'E': {
                        base: 659.25,
                        notes: [739.99, 830.61, 880.00, 987.77],
                        labels: ['F#5', 'G#5', 'A5', 'B5']
                    }
                };

                this.voices = [];
            }

            init() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0;
                this.masterGain.connect(this.ctx.destination);

                this.filterNode = this.ctx.createBiquadFilter();
                this.filterNode.type = "lowpass";
                this.filterNode.frequency.value = 2500;
                this.filterNode.connect(this.masterGain);

                this.lfo = this.ctx.createOscillator();
                this.lfo.frequency.value = 6.0;
                this.lfoGain = this.ctx.createGain();
                this.lfoGain.gain.value = 6.0;
                this.lfo.connect(this.lfoGain);
                this.lfo.start();

                // 4 Voices for fingers
                for (let i = 0; i < 4; i++) {
                    const voice = {
                        osc: this.ctx.createOscillator(),
                        gain: this.ctx.createGain()
                    };

                    voice.osc.type = 'sawtooth';
                    voice.gain.gain.value = 0;

                    this.lfoGain.connect(voice.osc.frequency);
                    voice.osc.connect(voice.gain);
                    voice.gain.connect(this.filterNode);
                    voice.osc.start();

                    this.voices.push(voice);
                }

                // Open String Voice
                this.openStringVoice = {
                    osc: this.ctx.createOscillator(),
                    gain: this.ctx.createGain()
                };
                this.openStringVoice.osc.type = 'sawtooth';
                this.openStringVoice.gain.gain.value = 0;
                this.lfoGain.connect(this.openStringVoice.osc.frequency);
                this.openStringVoice.osc.connect(this.openStringVoice.gain);
                this.openStringVoice.gain.connect(this.filterNode);
                this.openStringVoice.osc.start();

                this.isInit = true;

                document.getElementById('audio-status').textContent = "Audio Active";
                document.getElementById('audio-status').className = "status-badge status-active";

                // Set initial frequencies
                this.setString(this.currentString, true);
            }

            setString(stringName, force = false) {
                if (!this.isInit) return;
                if (!force && this.currentString === stringName) return;

                this.currentString = stringName;

                const data = this.stringMap[stringName];
                const now = this.ctx.currentTime;
                const slideTime = 0.05;

                // Open string
                this.openStringVoice.osc.frequency.setTargetAtTime(data.base, now, slideTime);

                // Fingers
                for (let i = 0; i < 4; i++) {
                    this.voices[i].osc.frequency.setTargetAtTime(data.notes[i], now, slideTime);
                }
            }

            updateFingers(bentFingers) {
                if (!this.isInit) return;
                const now = this.ctx.currentTime;

                let anyFingerBent = false;
                const activeLabels = [];
                const data = this.stringMap[this.currentString];

                for (let i = 0; i < 4; i++) {
                    if (bentFingers[i]) {
                        this.voices[i].gain.gain.setTargetAtTime(1.0, now, 0.02);
                        anyFingerBent = true;
                        activeLabels.push(data.labels[i]);
                    } else {
                        this.voices[i].gain.gain.setTargetAtTime(0, now, 0.02);
                    }
                }

                if (!anyFingerBent) {
                    this.openStringVoice.gain.gain.setTargetAtTime(1.0, now, 0.02);
                    activeLabels.push(this.currentString + " (Open)");
                } else {
                    this.openStringVoice.gain.gain.setTargetAtTime(0, now, 0.02);
                }

                document.getElementById('note-display').innerText = activeLabels.join(', ');
            }

            bow(velocity) {
                if (!this.isInit) return;
                const sensitivity = 10.0;
                let targetGain = velocity * sensitivity;
                if (targetGain > 0.8) targetGain = 0.8;
                this.masterGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.05);
            }

            stop() {
                if (this.masterGain) {
                    this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
                }
            }
        }

        const violin = new ViolinSynth();

        // --- 2. Logic & State ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const loadingDiv = document.getElementById('loading');
        const stringIndicator = document.getElementById('string-indicator');

        let previousBowX = null;
        let lastTime = 0;
        let activeStringId = 'E';

        startBtn.addEventListener('click', () => {
            if (!violin.isInit) {
                violin.init();
                startBtn.textContent = "Violin Active";
                startBtn.disabled = true;
            }
        });

        function isFingerBent(landmarks, tipIdx, pipIdx) {
            const wrist = landmarks[0];
            const tip = landmarks[tipIdx];
            const pip = landmarks[pipIdx];
            return Math.hypot(tip.x - wrist.x, tip.y - wrist.y) < Math.hypot(pip.x - wrist.x, pip.y - wrist.y);
        }

        // --- 3. MediaPipe Setup ---
        function onResults(results) {
            loadingDiv.style.display = 'none';
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Draw dimmed video
            canvasCtx.globalAlpha = 0.5;
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.globalAlpha = 1.0;

            let leftHand = null;  // Bow (Left Handed)
            let rightHand = null; // Fretboard (Left Handed)

            if (results.multiHandLandmarks && results.multiHandedness) {
                document.getElementById('track-status').textContent = "Tracking";
                document.getElementById('track-status').className = "status-badge status-active";

                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const classification = results.multiHandedness[i];
                    const label = classification.label;
                    if (label === 'Left') leftHand = landmarks;
                    if (label === 'Right') rightHand = landmarks;
                }
            } else {
                document.getElementById('track-status').textContent = "No Hands";
                document.getElementById('track-status').className = "status-badge status-inactive";
                violin.stop();
            }

            const currentTime = Date.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // --- 4. String Selection Logic (HEIGHT BASED REVERT) ---

            const strings = [
                { id: 'E', color: '#FF4D4D' },
                { id: 'A', color: '#4DA6FF' },
                { id: 'D', color: '#D4A017' },
                { id: 'G', color: '#C0C0C0' }
            ];

            if (leftHand) {
                const wristY = leftHand[0].y; // 0 is top, 1 is bottom
                const buffer = 0.05; // Hysteresis buffer

                // E (Top) -> G (Bottom) Logic
                // E | 0.35 | A | 0.52 | D | 0.68 | G

                if (activeStringId === 'E') {
                    if (wristY > 0.35 + buffer) activeStringId = 'A';
                }
                else if (activeStringId === 'A') {
                    if (wristY < 0.35 - buffer) activeStringId = 'E';
                    else if (wristY > 0.52 + buffer) activeStringId = 'D';
                }
                else if (activeStringId === 'D') {
                    if (wristY < 0.52 - buffer) activeStringId = 'A';
                    else if (wristY > 0.68 + buffer) activeStringId = 'G';
                }
                else if (activeStringId === 'G') {
                    if (wristY < 0.68 - buffer) activeStringId = 'D';
                }

                // Safety catch
                if (activeStringId === 'E' && wristY > 0.6) activeStringId = 'D';
                if (activeStringId === 'G' && wristY < 0.4) activeStringId = 'A';

                violin.setString(activeStringId);
                stringIndicator.innerText = `String: ${activeStringId}`;
                stringIndicator.style.color = strings.find(s => s.id === activeStringId).color;
            }

            // Draw Strings Visual Overlay (Fixed Background)
            const stringYPositions = [0.3, 0.45, 0.6, 0.75]; // Visual positions
            strings.forEach((s, idx) => {
                const yPos = stringYPositions[idx] * canvasElement.height;
                canvasCtx.beginPath();
                canvasCtx.moveTo(0, yPos);
                canvasCtx.lineTo(canvasElement.width, yPos);

                if (s.id === activeStringId) {
                    canvasCtx.lineWidth = 4;
                    canvasCtx.strokeStyle = s.color;
                    canvasCtx.shadowBlur = 20;
                    canvasCtx.shadowColor = s.color;
                } else {
                    canvasCtx.lineWidth = 1;
                    canvasCtx.strokeStyle = "rgba(255,255,255,0.1)"; // Faint
                    canvasCtx.shadowBlur = 0;
                }
                canvasCtx.stroke();
                canvasCtx.shadowBlur = 0;

                canvasCtx.fillStyle = "rgba(255,255,255,0.3)";
                canvasCtx.font = "14px Arial";
                canvasCtx.fillText(s.id, 20, yPos - 5);
            });

            // --- 5. Fretboard (Right Hand) ---
            if (rightHand) {
                drawConnectors(canvasCtx, rightHand, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 1 });

                const fingersBent = [
                    isFingerBent(rightHand, 8, 6),
                    isFingerBent(rightHand, 12, 10),
                    isFingerBent(rightHand, 16, 14),
                    isFingerBent(rightHand, 20, 18)
                ];

                violin.updateFingers(fingersBent);

                const tips = [8, 12, 16, 20];
                tips.forEach((tipIdx, i) => {
                    if (fingersBent[i]) {
                        const pt = rightHand[tipIdx];
                        canvasCtx.beginPath();
                        canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 10, 0, 2 * Math.PI);
                        canvasCtx.fillStyle = strings.find(s => s.id === activeStringId).color;
                        canvasCtx.fill();
                    }
                });
            } else {
                violin.updateFingers([false, false, false, false]);
            }

            // --- 6. Bowing (Left Hand) ---
            if (leftHand) {
                const wrist = leftHand[0];
                const currentX = wrist.x;

                const wx = wrist.x * canvasElement.width;
                const wy = wrist.y * canvasElement.height;

                // Dynamic Bow Visual
                canvasCtx.beginPath();
                canvasCtx.moveTo(wx - 200, wy);
                canvasCtx.lineTo(wx + 200, wy);
                canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                canvasCtx.lineWidth = 3;
                canvasCtx.stroke();

                // Draw Hand Skeleton (Bow Hand)
                drawConnectors(canvasCtx, leftHand, HAND_CONNECTIONS, { color: strings.find(s => s.id === activeStringId).color, lineWidth: 2 });

                if (previousBowX !== null) {
                    let diff = Math.abs(currentX - previousBowX);
                    let speed = diff / deltaTime;
                    if (speed < 0.05) speed = 0;
                    violin.bow(speed);

                    if (speed > 0.1) {
                        canvasCtx.beginPath();
                        canvasCtx.arc(wx, wy, 15 + (speed * 50), 0, 2 * Math.PI);
                        canvasCtx.fillStyle = `rgba(255,255,255,${Math.min(speed * 0.5, 0.4)})`;
                        canvasCtx.fill();
                    }
                }
                previousBowX = currentX;
            } else {
                previousBowX = null;
                violin.stop();
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start();

    </script>
</body>

</html>
